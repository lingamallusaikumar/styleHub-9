version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stylehub_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-stylehub-production-key-2026
      - ALLOWED_HOSTS=*
    volumes:
      - ./backend:/app/backend
    restart: always

  frontend:
    image: node:20-alpine
    container_name: stylehub_frontend
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: always
